<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Columbia Cue Club — Live Console</title>
<meta name="description" content="Live, multi-user 15-Ball tournament console: sign in, manage entrants, run a double-elimination bracket, and score matches from your phone." />
<style>
  :root{
    --bg:#0f1216; --panel:#171b21; --panel2:#1e232b; --line:#2a313b;
    --fg:#e8ecf1; --mut:#9aa6b2; --pri:#3b82f6; --pri2:#2563eb;
    --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --chipW:#1d4ed8; --chipL:#b45309; --chipGF:#7c3aed;
    color-scheme: dark;
  }
  *{box-sizing:border-box}
  body{margin:0;font:16px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--fg);
       padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  header.top{position:sticky;top:0;z-index:10;background:var(--panel);border-bottom:1px solid var(--line);
       display:flex;align-items:center;gap:.6rem;padding:.7rem .9rem}
  header.top h1{font-size:1rem;margin:0;font-weight:700;letter-spacing:.2px}
  header.top .who{margin-left:auto;font-size:.8rem;color:var(--mut);text-align:right}
  main{max-width:720px;margin:0 auto;padding:.9rem}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:1rem;margin:.7rem 0}
  h2{font-size:1.05rem;margin:.2rem 0 .8rem}
  h3{font-size:.9rem;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:1.1rem 0 .4rem}
  label{display:block;font-size:.82rem;color:var(--mut);margin:.6rem 0 .2rem}
  input,select,textarea{width:100%;padding:.7rem .8rem;background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--fg);font-size:1rem;font-family:inherit}
  textarea{resize:vertical}
  input[type=checkbox]{width:auto;transform:scale(1.3);margin-right:.5rem}
  .row{display:flex;gap:.6rem;flex-wrap:wrap}
  .row>*{flex:1;min-width:0}
  button{appearance:none;border:1px solid var(--line);background:var(--panel2);color:var(--fg);
       padding:.7rem .9rem;border-radius:10px;font-size:.95rem;font-weight:600;cursor:pointer;min-height:44px}
  button.pri{background:var(--pri);border-color:var(--pri2)}
  button.pri:active{background:var(--pri2)}
  button.ghost{background:transparent}
  button:disabled{opacity:.5}
  ul.list{list-style:none;margin:0;padding:0}
  ul.list li{display:flex;align-items:center;gap:.6rem;padding:.6rem .2rem;border-bottom:1px solid var(--line)}
  ul.list li:last-child{border-bottom:0}
  .pill{font-size:.7rem;font-weight:700;padding:.15rem .5rem;border-radius:999px;border:1px solid var(--line);color:var(--mut);white-space:nowrap}
  .pill.W{background:rgba(29,78,216,.18);color:#93b4ff;border-color:#28407a}
  .pill.L{background:rgba(180,83,9,.18);color:#f2c08a;border-color:#6d4416}
  .pill.GF{background:rgba(124,58,237,.18);color:#c6a8ff;border-color:#4c3178}
  .pill.state{}
  .match{display:flex;align-items:center;gap:.5rem;padding:.6rem 0;border-bottom:1px solid var(--line)}
  .match .lbl{width:3.4rem;font-variant-numeric:tabular-nums;font-weight:700;color:var(--mut);font-size:.8rem}
  .match .vs{flex:1;min-width:0}
  .match .vs b{font-weight:600}
  .win{background:var(--ok);border-color:#12823b}
  .muted{color:var(--mut)}
  .note{font-size:.82rem;color:var(--mut)}
  .err{color:#fca5a5;font-size:.85rem;margin:.4rem 0}
  .spacer{height:.5rem}
  .toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);
       padding:.6rem 1rem;border-radius:10px;max-width:90%;z-index:50;box-shadow:0 6px 24px rgba(0,0,0,.4)}
  a{color:#93b4ff}
  .qrwrap{display:flex;align-items:center;gap:.9rem;flex-wrap:wrap;margin:.5rem 0}
  .qrwrap .qr{background:#fff;padding:8px;border-radius:8px;line-height:0}
  .qrwrap .lnk{font-size:.82rem;color:var(--mut);word-break:break-all;flex:1;min-width:180px}
  .preview{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:.4rem 0}
  .prow{display:flex;flex-wrap:wrap;gap:.4rem .8rem;align-items:baseline;padding:.45rem .6rem;border-bottom:1px solid var(--line)}
  .prow:last-child{border-bottom:0}
  .prow.phead{background:var(--panel2);font-size:.8rem}
  .prow b{flex:1 0 40%}
  .prow span{flex:1 0 auto}
  .prow.dupe{background:rgba(180,83,9,.12)}
  .pill.warn{background:rgba(180,83,9,.22);color:#f2c08a;border-color:#6d4416}
  .pill.seed{background:rgba(29,78,216,.18);color:#93b4ff;border-color:#28407a}
  .pill.venue{background:rgba(5,150,105,.18);color:#7fe0b8;border-color:#1f6b52}
  .note.warn{color:#f2c08a}
  .prow.review{background:rgba(180,83,9,.12)}
  .prow .mcell{flex:1 0 100%}
  .prow .mcell select{max-width:100%}
  select.bulkchoose{font-size:.8rem;padding:.3rem .4rem;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--fg)}
  .cmp{margin:.35rem 0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .cmprow{display:flex;gap:.4rem;padding:.3rem .5rem;border-bottom:1px solid var(--line);font-size:.8rem;align-items:baseline}
  .cmprow:last-child{border-bottom:0}
  .cmprow.cmphead{background:var(--panel2);font-weight:700;color:var(--mut);font-size:.72rem}
  .cmprow .cmplbl{flex:0 0 5.5rem;color:var(--mut)}
  .cmprow .cmpv{flex:1 1 0;min-width:0;word-break:break-word}
  .cmprow.cmpdiff{background:rgba(180,83,9,.14)}
  .cmprow.cmpdiff .cmpv{color:#f2c08a}
  .editrow{display:block}
  /* ---- duplicate-player review (organizer-wide) ---- */
  .dupelist>li{display:block;padding:.6rem 0;border-bottom:1px solid var(--line)}
  .dupelist>li:last-child{border-bottom:0}
  .dupelist .row{gap:.4rem;flex-wrap:wrap}
  .dupelist .row .pri{flex:1 1 8rem}

  /* ---- connected-tree bracket (namespaced under .bracket; ported from bracket-mockup.html) ---- */
  .bracket{--gold:#e0b34a;
    --card-w:200px;    /* match card width */
    --gap-x:46px;      /* space for the connector column between rounds */
    --pair-gap:26px;   /* vertical gap between the two cards of a feeding pair */
  }
  .bracket .scroller{overflow-x:auto;overflow-y:hidden;padding:.4rem .2rem 1.4rem;position:relative}
  .bracket .scroller::-webkit-scrollbar{height:10px}
  .bracket .scroller::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}
  .bracket .canvas{display:inline-flex;flex-direction:column;gap:2.2rem;min-width:min-content}

  .bracket .region{position:relative}
  .bracket .region-title{display:inline-flex;align-items:center;gap:.5rem;font-size:.72rem;font-weight:700;
    text-transform:uppercase;letter-spacing:.09em;color:var(--mut);margin:0 0 .55rem 2px}
  .bracket .region-title .dot{width:.7rem;height:.7rem;border-radius:3px}
  .bracket .region.win  .region-title .dot{background:var(--chipW)}
  .bracket .region.los  .region-title .dot{background:var(--chipL)}
  .bracket .region.gf   .region-title .dot{background:var(--chipGF)}

  .bracket .rounds{display:flex;align-items:stretch}
  .bracket .round{display:flex;flex-direction:column;justify-content:space-around;
    width:var(--card-w);margin-right:var(--gap-x);flex:0 0 auto}
  .bracket .round:last-child{margin-right:0}
  .bracket .round-head{position:sticky;top:0;z-index:5;font-size:.66rem;font-weight:700;letter-spacing:.06em;
    text-transform:uppercase;color:var(--mut);text-align:center;margin-bottom:.5rem;
    padding:.15rem 0;background:linear-gradient(var(--panel),var(--panel) 70%,transparent)}

  .bracket .match{position:relative;display:block;background:var(--panel);border:1px solid var(--line);border-radius:10px;
    margin:calc(var(--pair-gap)/2) 0;box-shadow:0 1px 0 rgba(0,0,0,.3)}
  .bracket .slot{display:flex;align-items:center;gap:.5rem;padding:.42rem .55rem;width:100%;text-align:left;
    background:transparent;border:0;color:var(--fg);font:inherit;min-height:0;border-radius:0}
  .bracket button.slot{cursor:pointer}
  .bracket button.slot:active{background:rgba(59,130,246,.14)}
  .bracket .slot + .slot{border-top:1px solid var(--line)}
  .bracket .seed{font-size:.64rem;font-weight:700;color:var(--mut);min-width:1.35rem;text-align:center;
    border:1px solid var(--line);border-radius:5px;padding:.05rem .1rem;font-variant-numeric:tabular-nums;flex:0 0 auto}
  .bracket .name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.86rem}
  .bracket .score{font-variant-numeric:tabular-nums;font-weight:700;color:var(--mut);min-width:1.1rem;text-align:right;flex:0 0 auto}
  .bracket .slot.win{background:rgba(22,163,74,.10)}
  .bracket .slot.win .name{font-weight:700;color:var(--fg)}
  .bracket .slot.win .score{color:#7ee2a6}
  .bracket .slot.win::before{content:"";position:absolute;left:0;width:3px;top:0;height:50%;background:var(--ok);border-radius:3px 0 0 3px}
  .bracket .match.bottomwin .slot.win::before{top:50%}
  .bracket .slot.lose .name{color:var(--mut)}
  .bracket .slot.tbd .name{color:var(--mut);font-style:italic}
  .bracket .slot.bye .name{color:var(--mut)}
  .bracket .origin{font-size:.6rem;color:var(--mut);border:1px dashed var(--line);border-radius:4px;padding:0 .25rem}

  .bracket .mlabel{position:absolute;top:-.62rem;left:.5rem;font-size:.58rem;font-weight:700;letter-spacing:.04em;
    color:var(--mut);background:var(--panel);padding:0 .3rem;border-radius:4px;z-index:2}

  .bracket .match.is-live{border-color:var(--pri);box-shadow:0 0 0 2px rgba(59,130,246,.35),0 0 18px rgba(59,130,246,.25)}
  .bracket .match.is-live .mlabel{color:#bcd2ff}
  .bracket .live-pill{position:absolute;top:-.62rem;right:.5rem;font-size:.55rem;font-weight:800;letter-spacing:.08em;
    color:#fff;background:var(--pri);padding:.05rem .4rem;border-radius:999px;z-index:2;animation:bracketPulse 1.6s ease-in-out infinite}
  @keyframes bracketPulse{0%,100%{box-shadow:0 0 0 0 rgba(59,130,246,.5)}50%{box-shadow:0 0 0 5px rgba(59,130,246,0)}}

  .bracket .round:not(:last-child) .match::after{content:"";position:absolute;right:calc(-1 * var(--gap-x));top:50%;
    width:calc(var(--gap-x)/2);height:2px;background:var(--line)}
  .bracket .round:not(:last-child) .match.pair-top::before{content:"";position:absolute;
    right:calc(-1 * var(--gap-x)/2);top:50%;width:2px;background:var(--line);
    height:calc(100% + var(--pair-gap));z-index:0}
  .bracket .lead::before{content:"";position:absolute;left:calc(-1 * var(--gap-x)/2);top:50%;
    width:calc(var(--gap-x)/2);height:2px;background:var(--line)}

  .bracket .gf .rounds{align-items:center}
  .bracket .champ{width:var(--card-w);display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:.3rem;background:var(--panel);border:1px solid var(--chipGF);border-radius:12px;padding:1rem .6rem;
    box-shadow:0 0 22px rgba(124,58,237,.22)}
  .bracket .champ .trophy{font-size:1.6rem}
  .bracket .champ .who2{font-weight:800;font-size:1.05rem}
  .bracket .champ .cap{font-size:.62rem;text-transform:uppercase;letter-spacing:.09em;color:var(--gold);font-weight:700}
  .bracket .cond{font-size:.62rem;color:var(--mut);text-align:center;margin-top:.35rem}

  @media (max-width:640px){
    .bracket{--card-w:158px;--gap-x:32px;--pair-gap:18px}
    .bracket .name{font-size:.8rem}
  }
</style>
</head>
<body>
  <header class="top">
    <h1>Cue Club · Live</h1>
    <div class="who" id="who"></div>
  </header>
  <main id="app"><div class="card">Loading…</div></main>
  <div id="toast" class="toast" hidden></div>

  <script src="api-client.js"></script>
  <script src="qrcode.min.js"></script>
  <script src="roster.js"></script>
  <script src="live.js"></script>
</body>
</html>
